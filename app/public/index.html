<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学习通作业总览</title>
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<script src="/vendor/katex/katex.min.js"></script>
<script src="/vendor/katex/auto-render.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #fff;
    --text: #1f2430;
    --muted: #8a90a0;
    --line: #eceef2;
    --blue: #2f6bff;
    --red: #e5484d;
    --orange: #e08600;
    --green: #12b76a;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 940px; margin: 0 auto; padding: 36px 20px 80px; }

  /* ---------- 顶部 ---------- */
  header { display: flex; align-items: flex-end; gap: 20px; margin-bottom: 22px; flex-wrap: wrap; }
  .brand { flex: 1; min-width: 220px; }
  .brand h1 { margin: 0; font-size: 22px; letter-spacing: .3px; }
  .brand .sub { margin-top: 6px; color: var(--muted); font-size: 12.5px; }
  .brand .sub b { color: var(--red); }
  .stat {
    display: flex; align-items: baseline; gap: 8px;
    padding: 10px 18px; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px;
  }
  .stat .num { font-size: 26px; font-weight: 650; line-height: 1; color: var(--red); font-variant-numeric: tabular-nums; }
  .stat .num.zero { color: var(--green); }
  .stat .lbl { font-size: 12.5px; color: var(--muted); }

  /* ---------- 工具条 ---------- */
  .toolbar { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .search {
    flex: 1; min-width: 200px; height: 40px; padding: 0 14px;
    border: 1px solid var(--line); border-radius: 11px; background: var(--card);
    font: inherit; font-size: 13.5px; color: var(--text); outline: none;
  }
  .search:focus { border-color: #b8c6ff; box-shadow: 0 0 0 3px rgba(47,107,255,.1); }
  .btn {
    height: 40px; padding: 0 16px; border: 1px solid var(--line); border-radius: 11px;
    background: var(--card); color: #4b5262; font: inherit; font-size: 13.5px;
    cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
    transition: background .14s, border-color .14s;
  }
  .btn:hover { background: #fbfbfd; border-color: #dfe3ea; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.primary:hover { background: #1f57e0; }
  .spin { animation: sp .9s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* ---------- 区块 ---------- */
  .sec-title {
    display: flex; align-items: center; gap: 9px;
    margin: 26px 2px 10px; font-size: 12.5px; font-weight: 650;
    color: #6b7280; letter-spacing: .5px;
  }
  .sec-title .pill {
    padding: 1px 8px; border-radius: 999px; background: #eef1f6;
    color: #6b7280; font-size: 11.5px;
  }

  .row {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 15px 16px; margin-bottom: 8px;
    background: var(--card); border: 1px solid var(--line); border-radius: 13px;
    transition: border-color .14s, box-shadow .14s, transform .14s;
  }
  .row:hover { border-color: #dfe3ea; box-shadow: 0 4px 16px rgba(16,24,40,.06); }
  .row.done { opacity: .78; }
  .row .main { flex: 1; min-width: 0; }
  .row .title {
    font-size: 14.5px; font-weight: 550; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .row.done .title { font-weight: 450; color: #4b5262; }
  .row .meta { margin-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
  .chip {
    padding: 2px 8px; border-radius: 7px; background: #f2f4f7; color: #5b6273;
    font-size: 12px; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    cursor: pointer;
  }
  .chip:hover { background: #e9edf5; color: var(--blue); }
  .due { font-variant-numeric: tabular-nums; }
  .due.soon { color: var(--orange); font-weight: 550; }
  .due.expired { color: var(--red); font-weight: 550; }

  .right { flex: none; display: flex; align-items: center; gap: 9px; }
  .status { padding: 3px 9px; border-radius: 7px; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .status.todo { background: #fff1f0; color: #d32f2f; }
  .status.soon { background: #fff7e6; color: #b26a00; }
  .status.done { background: #f2f4f7; color: #8a90a0; }
  .go {
    padding: 7px 14px; border-radius: 8px; background: var(--blue); color: #fff;
    font-size: 12.5px; font-weight: 500; text-decoration: none; white-space: nowrap;
  }
  .go:hover { background: #1f57e0; }

  .toggle {
    display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px;
    border: 0; border-radius: 8px; background: transparent;
    color: #6b7280; font: inherit; font-size: 12.5px; font-weight: 650; cursor: pointer;
  }
  .toggle:hover { background: #eef1f6; }
  .caret { transition: transform .16s; }
  .caret.open { transform: rotate(90deg); }

  /* ---------- 标签页 ---------- */
  .tabs { display: flex; gap: 4px; margin: -4px 0 16px; }
  .tab {
    padding: 8px 15px; border: 0; border-radius: 9px; background: transparent;
    color: #6b7280; font: inherit; font-size: 13.5px; font-weight: 550; cursor: pointer;
  }
  .tab:hover { background: #f2f4f7; }
  .tab.on { background: #e9edf5; color: #1f2430; }

  /* ---------- 题库 ---------- */
  .bank-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .bank-bar .btn { height: 38px; }
  .bank-stat { color: var(--muted); font-size: 12.5px; }
  .bank-filters { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .bank-filters .search { height: 38px; }
  .bank-filters select {
    height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 11px;
    background: #fff; font: inherit; font-size: 13px; color: var(--text); max-width: 260px;
  }
  .course-block { margin-bottom: 8px; }
  .course-h { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 10px; font-size: 15.5px; font-weight: 650; }
  .course-h .n { font-size: 12px; color: var(--muted); font-weight: 400; }
  .outline-h {
    margin: 18px 0 8px; padding-left: 9px; border-left: 3px solid var(--blue);
    font-size: 13px; font-weight: 650; color: #2f6bff;
  }
  .outline-h.alt { border-color: #e8c07d; color: #8a5a1a; }
  .asm-h { margin: 16px 0 8px; font-size: 12.5px; color: #6b7280; font-weight: 650; }
  .qcard { background: #fff; border: 1px solid var(--line); border-radius: 13px; padding: 15px 16px; margin-bottom: 9px; }
  .qhead { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .qtype { padding: 2px 7px; border-radius: 6px; background: #eef1f6; color: #5b6273; }
  .qstem { font-size: 14px; line-height: 1.65; white-space: pre-wrap; }
  .qopts { margin-top: 9px; display: grid; gap: 5px; }
  .qopt { font-size: 13px; color: #4b5262; padding: 5px 9px; border-radius: 8px; background: #fafbfc; }
  .qopt.correct { background: #eefbf3; color: #0a7a48; font-weight: 500; }
  .qmine { margin-top: 9px; font-size: 12.5px; color: #4b5262; background: #f7f9ff; border-left: 3px solid #c9d6ff; padding: 7px 10px; border-radius: 0 8px 8px 0; white-space: pre-wrap; }
  .qana { margin-top: 9px; font-size: 12.5px; color: #1f2430; background: #fffdf5; border-left: 3px solid #ffd88a; padding: 7px 10px; border-radius: 0 8px 8px 0; white-space: pre-wrap; }
  .qpts { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .pt { padding: 2px 8px; border-radius: 999px; background: #eef4ff; color: #2f6bff; font-size: 11.5px; }
  .summary { background: #fff; border: 1px solid var(--line); border-radius: 13px; padding: 15px 18px; font-size: 13px; line-height: 1.85; white-space: pre-wrap; }
  .summary h3 { font-size: 14px; margin: 14px 0 4px; }
  .summary h3:first-child { margin-top: 0; }
  .summary ul { margin: 4px 0 10px 18px; padding: 0; }
  .summary li { margin: 3px 0; }
  .summary p { margin: 0 0 8px; }

  /* ---------- 空状态 / 错误 ---------- */
  .empty {
    padding: 60px 20px; text-align: center; background: var(--card);
    border: 1px dashed var(--line); border-radius: 14px; color: var(--muted);
  }
  .empty .big { font-size: 34px; margin-bottom: 12px; }
  .empty .t { font-size: 14.5px; color: #4b5262; font-weight: 550; margin-bottom: 5px; }
  .empty .s { font-size: 13px; }

  .err {
    padding: 16px 18px; background: #fff8f8; border: 1px solid #ffd9d9;
    border-radius: 13px; color: #b42318; font-size: 13.5px; line-height: 1.8;
  }
  .err .hint { color: #8a5a5a; font-size: 12.5px; }

  /* ---------- 登录 ---------- */
  .mask {
    position: fixed; inset: 0; background: rgba(16,24,40,.45);
    display: none; align-items: center; justify-content: center; padding: 20px; z-index: 20;
  }
  .mask.on { display: flex; }
  .login {
    width: min(420px, 100%); background: #fff; border-radius: 18px; padding: 28px 30px 26px;
    box-shadow: 0 24px 70px rgba(16,24,40,.3);
  }
  .login h2 { margin: 0 0 6px; font-size: 18px; }
  .login p { margin: 0 0 20px; color: var(--muted); font-size: 12.5px; line-height: 1.7; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12.5px; color: #6b7280; margin-bottom: 6px; }
  .field input {
    width: 100%; height: 42px; padding: 0 13px; border: 1px solid var(--line);
    border-radius: 10px; font: inherit; font-size: 14px; outline: none;
  }
  .field input:focus { border-color: #b8c6ff; box-shadow: 0 0 0 3px rgba(47,107,255,.1); }
  .remember { display: flex; align-items: center; gap: 8px; margin: 14px 0 18px; font-size: 12.5px; color: #6b7280; }
  .remember input { width: 15px; height: 15px; accent-color: var(--blue); }
  .login .btn.primary { width: 100%; justify-content: center; height: 43px; font-size: 14.5px; }
  .login .msg { margin-top: 12px; font-size: 12.5px; color: var(--red); min-height: 18px; }

  footer { margin-top: 40px; text-align: center; color: #a8aebc; font-size: 12px; }
  footer a { color: #98a2b3; }

  @media (max-width: 620px) {
    .wrap { padding: 22px 12px 60px; }
    .brand h1 { font-size: 19px; }
    .stat { padding: 8px 14px; }
    .row { flex-wrap: wrap; }
    .right { width: 100%; justify-content: flex-end; }
    .search { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>作业总览</h1>
      <div class="sub" id="sub">正在读取…</div>
    </div>
    <div class="stat">
      <span class="num" id="todoNum">–</span>
      <span class="lbl">待完成</span>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab on" data-tab="homework">作业</button>
    <button class="tab" data-tab="bank">题库</button>
  </nav>

  <div class="toolbar" id="toolbar">
    <input class="search" id="search" type="search" placeholder="搜索课程或作业名…">
    <button class="btn" id="refresh">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
      </svg>
      刷新
    </button>
  </div>

  <div id="content"></div>
  <div id="bank" hidden></div>

  <footer>
    数据来自学习通网页版 · 登录态仅保存在本机 ·
    <a href="#" id="logout">退出登录</a>
  </footer>
</div>

<div class="mask" id="mask">
  <div class="login">
    <h2>登录学习通</h2>
    <p>用学习通账号登录一次，之后就一直用这个登录态抓取作业。</p>
    <div class="field">
      <label>手机号 / 账号</label>
      <input id="phone" type="text" autocomplete="username" placeholder="手机号">
    </div>
    <div class="field">
      <label>密码</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="密码">
    </div>
    <label class="remember">
      <input type="checkbox" id="remember">
      记住密码（存本机，登录态过期时自动重登）
    </label>
    <button class="btn primary" id="doLogin">登 录</button>
    <div class="msg" id="loginMsg"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const state = {
    items: [], courses: {}, ts: 0,
    filter: '', showDone: false,
    loading: true, needLogin: false, error: '',
    tab: 'homework', bank: null, hasConfig: false, courseFilter: '', bankQuery: ''
  };

  const $ = id => document.getElementById(id);
  const content = $('content');

  /* ---------------- 工具 ---------------- */
  const STATUS_TODO = ['未提交', '未交', '待提交', '未完成', '待重做', '已驳回'];

  function courseName(it) {
    return state.courses[it.courseId] || it.courseRaw || '未知课程';
  }

  function humanize(ms) {
    if (ms == null) return '';
    if (ms <= 0) return '已截止';
    const d = Math.floor(ms / 86400000);
    const h = Math.floor((ms % 86400000) / 3600000);
    const m = Math.floor((ms % 3600000) / 60000);
    if (d > 0) return d + ' 天' + (h > 0 ? ' ' + h + ' 小时' : '');
    if (h > 0) return h + ' 小时' + (m > 0 ? ' ' + m + ' 分' : '');
    return Math.max(1, m) + ' 分钟';
  }

  function urgency(it) {
    if (it.expired || it.remainMs === -1) return 'expired';
    if (it.remainMs != null && it.remainMs <= 24 * 3600000) return 'soon';
    return 'normal';
  }

  function fmtTime(ts) {
    if (!ts) return '—';
    const d = new Date(ts), p = n => String(n).padStart(2, '0');
    return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  function match(it) {
    const q = state.filter.trim().toLowerCase();
    if (!q) return true;
    return (it.title + ' ' + courseName(it)).toLowerCase().indexOf(q) >= 0;
  }

  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(k => {
      const v = attrs[k];
      if (v == null || v === false) return;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2).toLowerCase(), v);
      else n.setAttribute(k, v);
    });
    kids.flat(3).forEach(kid => {
      if (kid == null || kid === false) return;
      n.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid);
    });
    return n;
  }

  /* ---------------- 数据 ---------------- */
  const todoList = () => state.items
    .filter(i => i.kind === 'todo')
    .sort((a, b) => {
      const av = a.expired ? Infinity : (a.remainMs == null ? Infinity : a.remainMs);
      const bv = b.expired ? Infinity : (b.remainMs == null ? Infinity : b.remainMs);
      return av !== bv ? av - bv : a.title.localeCompare(b.title, 'zh-CN');
    });

  const doneList = () => state.items
    .filter(i => i.kind === 'done')
    .sort((a, b) => courseName(a).localeCompare(courseName(b), 'zh-CN'));

  async function load(force) {
    state.loading = true;
    render();
    try {
      const res = await fetch('/api/state' + (force ? '?force=1' : ''), { cache: 'no-store' });
      const data = await res.json();
      state.loading = false;
      if (!data.ok) {
        state.needLogin = !!data.needLogin;
        state.error = data.needLogin ? '' : (data.error || '抓取失败');
        if (data.phone) $('phone').value = data.phone;
      } else {
        state.items = data.items || [];
        state.courses = data.courses || {};
        state.ts = data.ts || 0;
        state.needLogin = false;
        state.error = '';
        if (data.phone) $('phone').value = data.phone;
      }
    } catch (e) {
      state.loading = false;
      state.error = '连不上本地服务：' + e.message;
    }
    $('mask').classList.toggle('on', state.needLogin);
    render();
  }

  /* ---------------- 渲染 ---------------- */
  function render() {
    const todo = todoList();
    const done = doneList();

    $('todoNum').textContent = state.loading && !state.items.length ? '–' : String(todo.length);
    $('todoNum').classList.toggle('zero', !state.loading && todo.length === 0);

    const sub = $('sub');
    if (state.loading && !state.items.length) sub.textContent = '正在读取学习通…';
    else if (state.needLogin) sub.textContent = '未登录，请先登录学习通';
    else if (state.items.length) {
      sub.innerHTML = '';
      sub.append('共 ' + state.items.length + ' 项 · 已交 ' + done.length + ' 项 · 更新于 ' + fmtTime(state.ts));
    } else sub.textContent = '暂无数据';

    $('refresh').disabled = state.loading;
    $('refresh').querySelector('svg').classList.toggle('spin', state.loading);

    content.innerHTML = '';

    if (state.needLogin) {
      content.appendChild(el('div', { class: 'empty' },
        el('div', { class: 'big', text: '🔐' }),
        el('div', { class: 't', text: '需要登录学习通' }),
        el('div', { class: 's', text: '点下面的按钮登录一次即可' }),
        el('button', { class: 'btn primary', style: 'margin-top:16px', onclick: () => $('mask').classList.add('on') }, '去登录')
      ));
      return;
    }

    if (state.error) {
      content.appendChild(el('div', { class: 'err' },
        state.error,
        el('div', { class: 'hint' }, '如果是登录态问题，点「退出登录」后重新登录一次。'),
        el('button', { class: 'btn', style: 'margin-top:12px', onclick: () => load(true) }, '重试')
      ));
      return;
    }

    if (state.loading && !state.items.length) {
      content.appendChild(el('div', { class: 'empty' },
        el('div', { class: 'big', text: '⏳' }),
        el('div', { class: 't', text: '正在汇总所有课程的作业…' })
      ));
      return;
    }

    const todoF = todo.filter(match);
    const doneF = done.filter(match);

    if (!state.items.length) {
      content.appendChild(el('div', { class: 'empty' },
        el('div', { class: 'big', text: '🗒️' }),
        el('div', { class: 't', text: '没有查到作业' }),
        el('div', { class: 's', text: '可能这学期还没布置作业' })
      ));
      return;
    }

    // 未交
    content.appendChild(el('div', { class: 'sec-title' },
      '未交作业', el('span', { class: 'pill', text: String(todoF.length) })
    ));

    if (!todoF.length) {
      content.appendChild(el('div', { class: 'empty', style: 'padding:44px 20px' },
        el('div', { class: 'big', text: state.filter ? '🔍' : '✅' }),
        el('div', { class: 't', text: state.filter ? '没有匹配的未交作业' : '没有欠着的作业' }),
        el('div', { class: 's', text: state.filter ? '换个关键词试试' : '全部搞定了' })
      ));
    } else {
      todoF.forEach(it => content.appendChild(row(it, false)));
    }

    // 已交
    if (doneF.length) {
      const caret = el('span', { class: 'caret' + (state.showDone ? ' open' : ''), text: '▶' });
      const toggle = el('button', { class: 'toggle' },
        caret, ' 已交 / 已处理 ', el('span', { class: 'pill', text: String(doneF.length) })
      );
      const box = el('div', { style: state.showDone ? '' : 'display:none' });
      toggle.addEventListener('click', () => {
        state.showDone = !state.showDone;
        box.style.display = state.showDone ? '' : 'none';
        caret.classList.toggle('open', state.showDone);
      });
      content.appendChild(el('div', { class: 'sec-title', style: 'margin-top:22px' }, toggle));
      doneF.forEach(it => box.appendChild(row(it, true)));
      content.appendChild(box);
    }
  }

  function row(it, isDone) {
    const u = urgency(it);
    const due = it.remainMs == null ? '' : humanize(it.remainMs);

    const chip = el('span', { class: 'chip', title: courseName(it), text: courseName(it) });
    chip.addEventListener('click', () => {
      state.filter = courseName(it);
      $('search').value = state.filter;
      render();
    });

    return el('div', { class: 'row' + (isDone ? ' done' : '') },
      el('div', { class: 'main' },
        el('div', { class: 'title', title: it.title, text: it.title }),
        el('div', { class: 'meta' },
          chip,
          due ? el('span', { class: 'due ' + u, text: (u === 'expired' ? '' : '剩 ') + due }) : null
        )
      ),
      el('div', { class: 'right' },
        el('span', {
          class: 'status ' + (isDone ? 'done' : (u === 'soon' ? 'soon' : 'todo')),
          text: it.expired ? '已截止未交' : it.status
        }),
        isDone ? null : el('a', { class: 'go', href: it.url, target: '_blank', rel: 'noopener', text: '去做' })
      )
    );
  }

  /* ---------------- 事件 ---------------- */
  $('search').addEventListener('input', e => { state.filter = e.target.value; render(); });
  $('refresh').addEventListener('click', () => load(true));

  $('doLogin').addEventListener('click', async () => {
    const phone = $('phone').value.trim();
    const password = $('password').value;
    if (!phone || !password) { $('loginMsg').textContent = '手机号和密码都要填'; return; }

    $('doLogin').disabled = true;
    $('doLogin').textContent = '登录中…';
    $('loginMsg').textContent = '';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone, password, remember: $('remember').checked })
      });
      const data = await res.json();
      if (!data.ok) {
        $('loginMsg').textContent = data.error || '登录失败';
      } else {
        $('password').value = '';
        $('mask').classList.remove('on');
        await load(true);
      }
    } catch (e) {
      $('loginMsg').textContent = '请求失败：' + e.message;
    } finally {
      $('doLogin').disabled = false;
      $('doLogin').textContent = '登 录';
    }
  });

  $('password').addEventListener('keydown', e => { if (e.key === 'Enter') $('doLogin').click(); });

  $('logout').addEventListener('click', async e => {
    e.preventDefault();
    await fetch('/api/logout', { method: 'POST' });
    state.items = []; state.courses = {}; state.ts = 0;
    state.needLogin = true;
    $('mask').classList.add('on');
    render();
  });

  // 每 5 分钟静默刷新；窗口重新聚焦且超过 5 分钟也刷一次
  setInterval(() => load(false), 5 * 60 * 1000);
  window.addEventListener('focus', () => {
    if (Date.now() - state.ts > 5 * 60 * 1000) load(false);
  });

  /* ---------------- 题库 ---------------- */
  const bankEl = $('bank');

  function switchTab(name) {
    state.tab = name;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
    $('toolbar').hidden = name !== 'homework';
    content.hidden = name !== 'homework';
    bankEl.hidden = name !== 'bank';
    if (name === 'bank') {
      if (!state.bank) loadBank();
      else renderBank();
    }
  }

  async function loadBank() {
    bankEl.innerHTML = '<div class="empty"><div class="big">⏳</div><div class="t">正在读取题库…</div></div>';
    try {
      const d = await (await fetch('/api/bank', { cache: 'no-store' })).json();
      state.bank = d.bank || null;
      state.hasConfig = !!d.hasConfig;
    } catch (e) { state.bank = null; }
    renderBank();
  }

  function bankTotals(bank) {
    const courses = Object.values((bank && bank.courses) || {});
    return {
      courses: courses.length,
      assignments: courses.reduce((s, c) => s + Object.keys(c.assignments).length, 0),
      questions: courses.reduce((s, c) => s + Object.values(c.assignments).reduce((t, a) => t + a.questions.length, 0), 0),
      analyzed: courses.reduce((s, c) => s + Object.values(c.assignments).reduce((t, a) => t + a.questions.filter(q => q.analysis).length, 0), 0)
    };
  }

  function renderBank() {
    bankEl.innerHTML = '';
    const bank = state.bank;
    const t = bankTotals(bank);

    bankEl.appendChild(el('div', { class: 'bank-bar' },
      el('button', { class: 'btn primary', id: 'btnRefreshBank', onclick: refreshBank }, '更新题库'),
      el('button', { class: 'btn', id: 'btnAnalyze', onclick: analyzeBank }, '生成解析'),
      el('button', {
        class: 'btn',
        onclick: () => { location.href = '/api/export.html' + (state.courseFilter ? '?course=' + state.courseFilter : ''); }
      }, '导出 HTML'),
      el('button', {
        class: 'btn',
        style: 'color:#8a90a0',
        onclick: () => { location.href = '/api/export' + (state.courseFilter ? '?course=' + state.courseFilter : ''); }
      }, 'Markdown'),
      el('span', {
        class: 'bank-stat',
        text: t.questions
          ? `${t.courses} 门课 · ${t.assignments} 个作业 · ${t.questions} 道题 · 已有解析 ${t.analyzed}`
          : '还没有题库数据'
      })
    ));

    if (!t.questions) {
      bankEl.appendChild(el('div', { class: 'empty' },
        el('div', { class: 'big', text: '📚' }),
        el('div', { class: 't', text: '题库还是空的' }),
        el('div', { class: 's', text: '点「更新题库」，会把已交作业的题目、正确答案和你的作答抓下来（1-2 分钟）' })
      ));
      return;
    }

    const sel = el('select', { onchange: e => { state.courseFilter = e.target.value; renderBankList(); } });
    sel.appendChild(el('option', { value: '' }, '全部课程'));
    Object.entries(bank.courses).forEach(([id, c]) => {
      const o = el('option', { value: id }, c.name || id);
      if (state.courseFilter === id) o.selected = true;
      sel.appendChild(o);
    });

    const q = el('input', { class: 'search', type: 'search', placeholder: '搜索题目、解析、知识点…', value: state.bankQuery });
    q.addEventListener('input', e => { state.bankQuery = e.target.value; renderBankList(); });

    bankEl.appendChild(el('div', { class: 'bank-filters' }, sel, q));

    const list = el('div');
    bankEl.appendChild(list);
    state._bankList = list;
    renderBankList();
  }

  function renderBankList() {
    const list = state._bankList;
    if (!list) return;
    list.innerHTML = '';
    const q = (state.bankQuery || '').trim().toLowerCase();
    const cid = state.courseFilter || '';
    const hit = x => (x.stem + ' ' + (x.points || []).join(' ') + ' ' + (x.analysis || '')).toLowerCase().includes(q);

    Object.entries(state.bank.courses).forEach(([id, course]) => {
      if (cid && cid !== id) return;
      const asms = Object.values(course.assignments);
      const block = el('div', { class: 'course-block' });
      let shown = 0;

      const head = el('div', { class: 'course-h' }, course.name || id, el('span', { class: 'n', text: `${asms.length} 个作业` }));
      block.appendChild(head);
      if (course.outline && !q) {
        block.appendChild(el('div', { class: 'outline-h' }, '教材知识点梳理 · ' + course.outline.book));
        block.appendChild(summaryBlock(course.outline.text));
      }
      if (course.summary && !q) {
        if (course.outline) block.appendChild(el('div', { class: 'outline-h alt' }, '题目提炼'));
        block.appendChild(summaryBlock(course.summary));
      }

      asms.forEach(a => {
        const qs = a.questions.filter(x => !q || hit(x));
        if (!qs.length) return;
        shown += qs.length;
        block.appendChild(el('div', { class: 'asm-h', text: `${a.title}（${a.status}）` }));
        qs.forEach(x => block.appendChild(questionCard(x)));
      });

      if (shown) list.appendChild(block);
    });

    if (!list.children.length) {
      list.appendChild(el('div', { class: 'empty' }, el('div', { class: 't', text: '没有匹配的题目' })));
    }
    typeset(list);
  }

  /** 把 $...$ / $$...$$ 排成印刷体公式 */
  function typeset(root) {
    if (!window.renderMathInElement || !root) return;
    try {
      renderMathInElement(root, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '\\[', right: '\\]', display: true },
          { left: '$', right: '$', display: false },
          { left: '\\(', right: '\\)', display: false }
        ],
        throwOnError: false,
        ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      });
    } catch (e) { /* 公式坏了不影响正文 */ }
  }

  /** 极简 Markdown：只认 ### 标题和 - 列表，够用了 */
  function summaryBlock(text) {
    const box = el('div', { class: 'summary' });
    let bullets = [];
    const flush = () => {
      if (!bullets.length) return;
      const ul = el('ul');
      bullets.forEach(t => ul.appendChild(el('li', { text: t })));
      box.appendChild(ul);
      bullets = [];
    };
    String(text).split('\n').forEach(line => {
      const t = line.trim();
      if (!t) { flush(); return; }
      const h = t.match(/^#{1,4}\s+(.*)$/);
      if (h) { flush(); box.appendChild(el('h3', { text: h[1] })); return; }
      const li = t.match(/^[-*]\s+(.*)$/);
      if (li) { bullets.push(li[1]); return; }
      flush();
      box.appendChild(el('p', { text: t }));
    });
    flush();
    return box;
  }

  function questionCard(x) {
    const card = el('div', { class: 'qcard' });
    if (x.type) {
      card.appendChild(el('div', { class: 'qhead' },
        el('span', { class: 'qtype', text: x.type + (x.score ? ' · ' + x.score + ' 分' : '') })
      ));
    }
    card.appendChild(el('div', { class: 'qstem', text: x.stem }));
    if (x.options && x.options.length) {
      const opts = el('div', { class: 'qopts' });
      x.options.forEach((o, i) => opts.appendChild(
        el('div', { class: 'qopt' + (o.correct ? ' correct' : '') }, `${String.fromCharCode(65 + i)}. ${o.text}`)
      ));
      card.appendChild(opts);
    }
    if (x.myAnswer) card.appendChild(el('div', { class: 'qmine', text: '我的答案：' + x.myAnswer }));
    if (x.analysis) card.appendChild(el('div', { class: 'qana', text: '解析：' + x.analysis }));
    if (x.points && x.points.length) {
      const pts = el('div', { class: 'qpts' });
      x.points.forEach(p => pts.appendChild(el('span', { class: 'pt', text: p })));
      card.appendChild(pts);
    }
    return card;
  }

  async function refreshBank() {
    const btn = $('btnRefreshBank');
    btn.disabled = true;
    btn.textContent = '抓取中…约 1-2 分钟';
    try {
      const d = await (await fetch('/api/bank/refresh', { method: 'POST' })).json();
      if (!d.ok) alert('抓取失败：' + (d.error || '未知错误'));
    } catch (e) { alert('抓取失败：' + e.message); }
    await loadBank();
  }

  async function analyzeBank() {
    if (!state.hasConfig) {
      alert('还没配置模型 API。\n在 app/config.json 里填 baseUrl / apiKey / model，然后重启服务。');
      return;
    }
    const btn = $('btnAnalyze');
    btn.disabled = true;
    btn.textContent = '生成中…可能要几分钟';
    try {
      const d = await (await fetch('/api/analyze', { method: 'POST' })).json();
      if (!d.ok) alert('生成失败：' + (d.error || '未知错误'));
      else {
        const bad = (d.result || []).filter(r => r.error);
        if (bad.length) alert('部分课程失败：\n' + bad.slice(0, 3).map(b => b.course + '：' + b.error).join('\n'));
      }
    } catch (e) { alert('生成失败：' + e.message); }
    await loadBank();
  }

  document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));

  load(false);
})();
</script>
</body>
</html>
